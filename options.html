<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Compact styling: reduced padding, font sizes, and margins */
    body { font-family: system-ui, sans-serif; color: black; background: white; padding: 12px; width: 340px; box-sizing: border-box; margin: 0; font-size: 0.9em; }
    h3 { margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid black; padding-bottom: 4px; font-size: 1.1em; text-align: center; }
    .setting-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.95em; }
    .checkbox-label { font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 4px; box-sizing: border-box; border: 1px solid black; font-size: 0.95em; }
    button { background: white; color: black; border: 2px solid black; padding: 6px 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.95em; }
    button:hover { background: black; color: white; }
    #quickBookmarkBtn { background: black; color: white; margin-bottom: 4px; }
    #quickBookmarkBtn:hover { background: #333; }
    #deleteBookmarkBtn { margin-bottom: 4px; border-color: #d9534f; color: #d9534f; }
    #deleteBookmarkBtn:hover { background: #d9534f; color: white; }
    .note { font-size: 0.85em; color: #555; margin-top: 2px; display: block; }
    .shortcut-link { display: block; text-align: center; margin-top: 6px; font-size: 0.85em; }
    .shortcut-link a { color: #0055cc; text-decoration: none; }
    .shortcut-link a:hover { text-decoration: underline; }
    #status { margin-top: 8px; font-weight: bold; height: 14px; font-size: 0.85em; text-align: center; color: green; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 12px 0; }
    .footer-links { text-align: center; font-size: 0.85em; margin-top: 8px; }
    .footer-links a { color: black; text-decoration: underline; margin: 0 5px; }
    
    /* New styles for the inline delay input */
    .inline-input { width: 60px !important; display: inline-block; text-align: center; }
    #doubleClickSettings { margin-top: 6px; margin-left: 24px; }
  </style>
</head>
<body>
  <h3>YouTube Timestamped Bookmarks</h3>
  
  <div class="setting-group">
    <button id="quickBookmarkBtn">Bookmark Current Time</button>
    <button id="deleteBookmarkBtn">Delete Bookmark for Video</button>
    <span class="note" style="text-align: center;">Hotkey: <b>Alt+Shift+X</b></span>
    <span class="shortcut-link"><a href="#" id="manageShortcutsLink">Change shortcut</a></span>
  </div>

  <hr>

  <div class="setting-group">
    <label for="iconAction">Icon Click Behavior:</label>
    <select id="iconAction">
      <option value="menu">Open Options Menu (Default)</option>
      <option value="bookmark">Action Mode (Create Bookmark Instantly)</option>
    </select>
    
    <!-- This section hides/shows dynamically based on the selection above -->
    <div id="actionSettings" style="display: none; margin-top: 8px;">
      <label class="checkbox-label">
        <input type="checkbox" id="doubleClickDelete">
        Enable double-click to delete 
      </label>
      <div id="doubleClickSettings" style="display: none;">
        <span class="note">Double-click speed: 
          <input type="number" id="doubleClickDelay" class="inline-input" min="100" max="1000" step="50" value="300"> ms
        </span>
      </div>
    </div>
  </div>

  <div class="setting-group">
    <label class="checkbox-label">
      <input type="checkbox" id="replaceExisting">
      Replace existing bookmark for video
    </label>
  </div>

  <div class="setting-group">
    <label for="titlePattern">Bookmark Title Pattern:</label>
    <input type="text" id="titlePattern" placeholder="e.g., {title} [{time}]">
    <span class="note">Variables: <b>{title}</b>, <b>{time}</b></span>
  </div>

  <div class="setting-group">
    <label for="truncateType">Truncate Video Title:</label>
    <select id="truncateType">
      <option value="none">Don't Truncate (Default)</option>
      <option value="characters">By Character Count</option>
      <option value="words">By Word Count</option>
    </select>
  </div>

  <div class="setting-group" id="truncateLengthGroup" style="display: none;">
    <label for="truncateLength">Maximum Limit:</label>
    <input type="number" id="truncateLength" min="1" value="50">
  </div>

  <button id="saveBtn">Save Preferences</button>
  <div id="status"></div>

  <hr>
  <div class="footer-links">
    <a href="https://github.com/Wegez/yt-timestamped-bookmarks/issues" target="_blank">Report Bug</a> | 
    <a href="https://github.com/Wegez/yt-timestamped-bookmarks" target="_blank">Source Code</a>
  </div>

  <script src="options.js"></script>
</body>
</html>
